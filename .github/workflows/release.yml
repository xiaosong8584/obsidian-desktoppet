name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify tag matches manifest.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # 预发布 tag（如 v1.1.0-rc.1 / v1.1.0-beta.2）只比较基版本，
          # 否则 1.1.0-rc.1 != 1.1.0 会把预发布 Release 直接挡死。
          base_version="${tag%%-*}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          echo "Tag              : ${GITHUB_REF_NAME}"
          echo "Tag base version : ${base_version}"
          echo "manifest version : ${manifest_version}"
          if [ "${base_version}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}. Bump manifest.json (and package.json) before tagging."
            exit 1
          fi
          if [ "${tag}" != "${manifest_version}" ]; then
            echo "ℹ️ Pre-release tag detected — base version matches manifest.json."
          fi
          echo "✅ Tag matches manifest.json version"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin (zip)
        run: |
          cd "$(git rev-parse --show-toplevel)"
          zip -r obsidian-desktoppet.zip main.js styles.css manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            styles.css
            manifest.json
            obsidian-desktoppet.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
