name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify tag matches manifest.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          echo "Tag version      : ${tag_version}"
          echo "manifest version : ${manifest_version}"
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}. Bump manifest.json (and package.json) before tagging."
            exit 1
          fi
          echo "✅ Tag matches manifest.json version"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin (zip)
        run: |
          cd "$(git rev-parse --show-toplevel)"
          zip -r obsidian-desktoppet.zip main.js styles.css manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            styles.css
            manifest.json
            obsidian-desktoppet.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
