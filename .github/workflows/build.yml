name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: |
            main.js
            styles.css
            manifest.json

      - name: Build summary
        run: echo "✅ Build passed — plugin-build artifact uploaded" >> "$GITHUB_STEP_SUMMARY"
